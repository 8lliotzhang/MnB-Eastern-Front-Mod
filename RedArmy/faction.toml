#   reskin = "<vanilla tag>"                   changes a weapon the game already has
#   tag = "<new tag>" + based_on = "<vanilla>" adds a new weapon, starting as a copy of a vanilla one
# REAL: tags, names, text and stats come from the "Weapons Stats" sheet.
# PLACEHOLDER: based_on picks, and every sound and mag_sprite (game ones reused for now).
# Art: files are weapons/top_<tag>.png (in hand) and weapons/side_<tag>.png (in menus).
#      Lines with "# top_sprite" / "# side_sprite" are waiting for art. Add the file, then remove the "# ".
# Own sounds: sound = "weapons/mosin" picks up mosin1.wav, mosin2.wav ... in that folder.

