# patch from the planning doc first. Until then the vanilla upgrades stay (Sten, M3, Thompson).
# unlocks = ["ptrd", "boysRifle", "ptrs"]

[classes.intel]              # vanilla Intel
name = "Diversant"
start_weapon = "tozB"
unlocks = ["ppshObrez", "mp40", "stg44"]


# ============================== VOICES ==============================
# Voice lines. Name the files like the game's: contact1.wav, pinned3.wav, alliedHurt1.wav ...
# The originals are in the game's sounds/vo/allied/ folder.
# PLACEHOLDER: the folder is empty, so all voices are still vanilla.
[voices]
folder = "voices"
fill_missing = true                          # reuse our lines when we have fewer than the game
map = { hurt = "alliedHurt" }                # lets us name files hurt1.wav instead of alliedHurt1.wav
# dirs = { frenchies = "voices_partisans" }  # the partisans' own voice folder


