#:schema ./faction.schema.json
# faction.toml: the Red Army takes over the Allied side. No code needed for anything in here.
#
# How to read this file:
#   REAL         = taken from the planning doc or the "Weapons Stats" sheet.
#   PLACEHOLDER  = a small example, nothing decided yet. Replace it.
#   Lines starting with "# " are switched off. Remove the "# " to switch them on.
#   Anything left out stays as in the vanilla game.
#
# Check the file after every change:   qm faction check RedArmy
# Full guide: QuarterMaster modding wiki, Part 3.

schema = 1                   # file format version, leave at 1
id = "red_army"              # stored in saves, never change it after release
name = "Red Army"
replaces = "allied"          # the side we take over
side_name = "Soviet"         # the word the game uses for our side
description = "117th Guards Rifle Regiment, 39th Guards Rifle Division. From the Dnieper to Berlin."


# ============================== NAMES ==============================
# Soldier names. PLACEHOLDER: the lists hold a few sample names.
[names]
last_file = "names/last.txt"             # one surname per line
# first_file = "names/first.txt"         # first names, only used with format = "full"
# format = "full"                        # "Ivan Petrov" instead of "I. Petrov"
vehicles = ["Za Rodinu", "Boevaya Podruga"]          # vehicle call signs
french = { last = ["Kovalenko", "Shevchenko"] }      # names for the partisans (the vanilla French unit)


# ============================== TEXT ==============================
# Replaces any game text by its name. The names are in the game's includes/localisation.lua.
# REAL: renames from the planning doc. The effect numbers are the vanilla ones, text can't change them.
[text]
conditionTitle_41 = "INSPIRING SPEECH"       # was Good Coffee
conditionText_41 = "Our zampolit has been doing a lot of good work for the company's morale, and after today's speech the boys feel inspired to show their resolve in combat. Allies have +5 to starting max morale and a +5% to movement speed."
conditionTitle_49 = "TO THE WEST!"           # was Gerhardt's Pressure
conditionText_49 = "Komdiv has issued a new directive, pressuring us to exploit the recent breakthrough and seize the next objective - now. Finish the map within 20 mins to get twice the XP or get nothing (0 xp)."
conditionTitle_19 = "HARDENED VETERANS"      # was Eastern Front Veterans
conditionText_19 = "The troops we are facing have been fighting for a while and are well accustomed to combat. Evidence suggests they are even using captured equipment against us. German units have a +5% bonus to combat skill."
conditionTitle_11 = "SPOILED PROVISIONS"     # was K Rations
conditionText_11 = "Unfortunately our provisions have spoiled, and those that didn't are neither appetising nor enough for the men. Allied forces have -10% max health during this mission."
conditionTitle_30 = "LIBERATED LIQUOR"       # was Pin Up
conditionText_30 = "The boys have captured some German schnapps. Spirits are high, and bottles are empty! +100 XP to the commander. Za zdorovye!"
conditionTitle_28 = "ACES OF THE LUFTWAFFE"  # was Last of the Luftwaffe
conditionText_28 = "The enemy has deployed some particularly skilled pilots to our sector, and frontal aviation is having a hard time. There is a 20% chance any enemy air support called by the Germans during this mission will make a second pass later on."
conditionTitle_38 = "SUBBOTNIK"              # was Voluntold
conditionText_38 = "One of our comrades has returned from a 'volunteer' debris clearing detail. His patriotic zeal has been somewhat tempered, but he gained some work experience. One soldier has a -5% to max morale and +1 XP."
conditionTitle_27 = "FREE HUNTERS"           # was Air Superiority (the doc wants 10%, vanilla is 20%)
conditionText_27 = "The aces of the 176th Guards Fighter Regiment are out hunting the Luftwaffe. Axis air support has a 20% chance to be cancelled when called."
conditionTitle_69 = "ADVANCED GUARD"         # was Tip of the Spear
conditionText_69 = "We are spearheading the breakthrough, smashing through enemy lines ahead of the main forces. The Germans are throwing everything they have at us! Expect +1 enemy for each day ahead"
# Same conditions, same names, new story text.
conditionText_20 = "Thanks to the bombing efforts of our Western Allies, the Fascists will receive less supplies than usual. Axis troops have -10% chance of having special equipment on this map."       # Failing Industry
conditionText_29 = "Comrades, the 45th Separate Guards Sapper Battalion found an enemy weapon cache while clearing mines. They were kind enough to drop us a crate. A spotted German weapon crate will be present at the starting line."       # On Site Acquisition
conditionText_37 = "Fresh supplies from our Western allies have arrived. Courtesy of Uncle Sam!"       # Industrialism
conditionText_54 = "Recon reports that enemy infiltration units have exploited a gap in our lines and may operate in your vicinity. 1% per kill to spawn Jagers."       # Compromised Lines
conditionText_56 = "The enemy is trying to repeat what they did in 1941 and has deployed Brandenburgers behind our lines. Command wants us to deal with them immediately."       # The Crucible
conditionText_61 = "Friendly troops have been cut off ahead and are in urgent need of supplies, and we are going to be the ones to deliver them. x2 XP if the crate makes it to the end, 0 XP if not."       # Secondary Duties
conditionText_74 = "The enemy has set up an HQ right where we are going to be advancing. This is an excellent opportunity to neutralise their leadership and capture valuable intel. Search the house for actionable intel if it still stands."       # Vultures Nest
conditionTitle_60 = "ARMED RESUPPLY"         # was Gravy Train (the tractor staying to fight needs code)
conditionText_60 = "Uncharacteristically, supply is quite efficient today and delivering goods directly to our frontlines. With each German casualty, there is a 3% chance of a T-20 Komsomolets supplying your section."
# Commander ability: 81mm mortars become 82mm.
skillText_5 = "82mm Mortars"
playerSkillText_5 = "82mm Mortars: Call in heavy mortar support. Relatively fast delivery and hard punching. 82mm mortars will deliver 8 rounds + 2 per rarity tiers."
lootText_ration = "Tushonka, +5 to max health"
lootText_molotov = "An incendiary bottle. Right click to use once looted."
# PLACEHOLDER: the doc's Guards ranks. Only the promote buttons are text; the rank names shown
# on soldiers (Recruit, Private, Corporal ...) are in game code and need a qm.toml patch.
# rankText_1 = "Promote to Gv. yefreitor, soldier gains +5% to his combat skill"
# rankText_2 = "Promote to Gv. Ml. Serzhant, soldier gains +10% to his combat skill"
# rankText_3 = "Promote to Gv. Serzhant, soldier gains +15% to his combat skill"


# ============================== UNIT ART ==============================
# One folder per unit, one image per animation frame: idle.png, aim.png, reload1.png ...
# Frame names are listed in the wiki (Part 3, "Frame names").
# PLACEHOLDER: the folders are empty, so every unit still looks vanilla.
[units.base]                 # the ordinary rifleman
folder = "units/base"

[units.sarge]                # the sergeant
folder = "units/sarge"
copy_from = "base"           # frames missing here use the base frames

[units.para]                 # vanilla paratroopers. Planned: Black Coats (Soviet marines)
folder = "units/para"
copy_from = "base"

[units.french]               # vanilla French resistance. Planned: partisans
folder = "units/french"
# frames = { idle = "units/shared/idle_cap.png" }    # point a single frame at any file


# ============================== WEAPONS ==============================
