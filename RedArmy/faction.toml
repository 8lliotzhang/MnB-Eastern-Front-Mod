#   pools = ["smg", "grunt"]     # the weapon joins these random pools (see POOLS below)


# ============================== POOLS ==============================
# The game draws loot and reinforcement weapons at random from these pools:
# allied, allied_sniper, grunt, para, resistance, smg, axis, axis_crew.
# REAL: the three partisan weapons from the stats sheet. The vanilla pool already has the MP 40.
[pools.resistance]           # weapons of the partisans (the vanilla French unit)
add = ["berdan", "tozB", "ppshObrez"]
# remove = ["shotgun", "sten", "bren"]       # PLACEHOLDER: vanilla guns to take out of the pool

# PLACEHOLDER: nothing decided for the other pools.
# [pools.grunt]
# add = ["mosin", "mosin38"]
# remove = ["springfield"]

# ============================== SPAWN SWAP ==============================
# Hands out one weapon wherever the game would hand our side another.
# REAL: recruits carry the Mosin M91/30 (vanilla recruits get the Springfield), and the
#       stats sheet says the PPD replaces the Sten.
# The check warns about "springfield": the game looks for that tag in 3 places
# (rifle sounds and the Standardization condition). Expected.
[spawn_swap]
springfield = "mosin"
sten = "ppd"
m1 = "svt40"               # Garands become SVT-40s, as in the doc's Standardisation list
m1941 = "avs36"
t20 = "avt40"
m3 = "pps"
bar = "dp"
bren = "dpm"
vicker = "mg42"
tommy = "ppsh41"
m1Carbine = "mosin38"
m1CarbinePara = "mosin44"
[sprites]
dpMag = "misc/dpMag.png"
ppsMag = "misc/ppsMag.png"
dtMag = "misc/dtMag.png"

# PLACEHOLDER: not decided. Until these are set, the game still hands out BARs and Thompsons.
# m1919 = "dt"
# scopedGarand = "scopedSvt40"
# scopedSpringfield = "scopedMosinPU"
# scopedEnfield = "scopedMosinPE"
# t22 = "as44"

# ============================== CLASSES ==============================
# The game has 12 class slots. We can rename and rebalance them, not add new ones.
# REAL: names, start weapons and unlocks (upgrade tiers 1 to 3) from the planning doc.
# "PPSh (stick)" in the doc is read as the box-magazine PPSh, "ppshBox".
# Where the doc gives two names ("Rifleman / Strelok") the Russian one is used. Change freely.
# The long class texts on the class screen (specTxt_rifle ... in [text]) are still vanilla.
# Other keys a class can have (PLACEHOLDER examples, see [classes.rifle]):
#   description   the text after the name. Left out = the vanilla text stays.
#   bonus         replaces the vanilla class bonus. Left out = the vanilla bonus stays.
#   skills        new names and text for the 3 skills. What a skill does stays vanilla.
#   icon          the class badge image.

[classes.rifle]              # vanilla Heavy Infantry
name = "Strelok"
start_weapon = "svt38"
unlocks = ["svt40", "avs36", "avt40"]
# description = "Medium to long range with semi-automatic rifles."     # PLACEHOLDER
# bonus = { speed = 0, skill = 5 }                                     # PLACEHOLDER
# icon = "icons/rifle.png"                                             # PLACEHOLDER

[classes.light]              # vanilla Light Infantry
name = "Avtomatchik"
start_weapon = "ppd"
unlocks = ["pps", "ppshBox", "ppsh41"]
# The third skill keeps its vanilla text until "Hail of fire" is coded.
skills = [
  "Smoke screen, Throws an RDG-1 smoke grenade to screen your troops",
  "Grenade, Throws an RG-42 offensive grenade",
  "Charge!! Cannot be pinned, 20% less damage received. Duration 10 sec",
]

[classes.gunner]             # vanilla Gunner
name = "Pulemetchik"
start_weapon = "dp"
unlocks = ["dpm", "dt", "mg42"]

[classes.medic]              # vanilla Medic
name = "Sanitar"
start_weapon = "mosin38"
unlocks = ["mosin44", "svt38", "svt40"]

[classes.comms]              # vanilla Signaller
name = "Radist"
start_weapon = "mosin38"
unlocks = ["mosin44", "pps", "ppshBox"]

[classes.officer]            # vanilla Officer
name = "Officer"
start_weapon = "mosin38"
unlocks = ["mosin44", "pps", "ppshBox"]
# The second skill keeps its vanilla text until "Focus Fire" is coded.
skills = [
  "Ura! All members of your squad will be unpinned and immune to suppression for 5 sec",
  "Tactical Movement, all members of your squad have movement reduced by 50%, 50% faster reaction time and accuracy + 20%. Dur 1 min.",
  "Tank support, Request a T-70 to support the squad for 3 min.",
]

[classes.engy]               # vanilla Engineer
name = "Assault Sapper"
start_weapon = "mosin38"
unlocks = ["mosin44", "pps", "ppshBox"]

[classes.scout]              # vanilla Scout
name = "Razvedchik"
start_weapon = "mosin38"
unlocks = ["mosin44", "pps", "ppshBox"]

[classes.sniper]             # vanilla Sniper
name = "Sniper"
start_weapon = "mosinSelected"
unlocks = ["scopedMosinPU", "scopedSvt40", "scopedMosinPE"]

[classes.commando]           # vanilla Commando
name = "Osnaz"
start_weapon = "mosin44"
unlocks = ["mosinBramit", "ppdBramit", "ppdBramitDrum"]
# Only the third skill is renamed (vanilla Raider Jeep).
skills = [
  "Camouflage, the Osnaz hides and remains undetected by non-Sniper/Scout units for 30 sec or until he fires",
  "Assassination, the next hand to hand strike has a 300% damage bonus.",
  "DShK Jeep, a Ford GPA amphibian mounting a DShK comes looking for trouble. Duration 3 min.",
]

[classes.sapper]             # vanilla Sapper
name = "AT Rifleman"
start_weapon = "mosin44"
# Switched off: the game only lets a soldier fire an AT rifle as a picked-up extra (10 shots).
